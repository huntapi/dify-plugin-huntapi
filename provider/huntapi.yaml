identity:
  author: huntapi
  name: huntapi
  label:
    en_US: HuntAPI
  description:
    en_US: 'Video and audio from public links with HuntAPI: read the metadata of videos from YouTube, TikTok, Instagram, Vimeo, X, Reddit and more, and download them as video or audio files.'
  icon: icon.svg
  tags:
  - videos
  - utilities
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: API Key
    placeholder:
      en_US: Enter your HuntAPI API key
    help:
      en_US: Get an API key in the HuntAPI dashboard.
    url: https://app.huntapi.com
tools:
- tools/media_metadata.yaml
- tools/download_video.yaml
- tools/download_audio.yaml
- tools/job_status.yaml
extra:
  python:
    source: provider/huntapi.py
